[project]
name = "wren-companion"
version = "0.1.12"
description = "Open-source Linux desktop companion — watches, points, and only acts when you say yes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wren contributors" }]
dependencies = ["PyGObject>=3.46"]

[project.scripts]
wren = "wren.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wren*"]

[tool.setuptools.package-data]
wren = ["assets/*.png", "gnome/**/*"]
